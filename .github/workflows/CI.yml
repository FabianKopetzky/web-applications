name: CI

on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - "hotfix/**"
      - "release/**"
  workflow_dispatch:

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # -------- Client --------
      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Lint client
        working-directory: client
        run: npm run lint

      # -------- Server --------
      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Test server
        working-directory: server
        run: npm test
